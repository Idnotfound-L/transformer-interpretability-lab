[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "transformer-interpretability-lab"
version = "0.3.0"
description = "A reproducible PyTorch and Hugging Face mechanistic interpretability research workspace"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Project contributors"}]
dependencies = ["torch>=2.1", "numpy>=1.24", "scikit-learn>=1.3"]

[project.optional-dependencies]
dashboard = ["pandas>=2.0", "plotly>=5.18", "streamlit>=1.32", "scikit-learn>=1.3", "tqdm>=4.66"]
dev = ["pytest>=7.4", "pytest-cov>=5.0", "ruff>=0.5"]
gpt2 = ["transformer-lens>=2.0", "transformers>=4.53.0", "accelerate>=0.30", "pandas>=2.0"]
huggingface = ["transformers>=4.53.0", "accelerate>=0.30.0", "safetensors>=0.4.3", "sentencepiece>=0.2.0", "pandas>=2.0", "tabulate>=0.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"
